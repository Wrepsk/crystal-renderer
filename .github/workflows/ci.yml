name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.configuration }} x64
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.100
          cache: true
          cache-dependency-path: |
            CrystalRenderer/packages.lock.json
            CrystalRenderer.Tests/packages.lock.json

      - name: Install Dalamud development files
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile dalamud.zip
          Expand-Archive -Force dalamud.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"

      - name: Restore locked dependencies
        run: dotnet restore CrystalRenderer.sln --locked-mode -p:Platform=x64

      - name: Build renderer and tests with analyzers
        run: dotnet build CrystalRenderer.sln --configuration ${{ matrix.configuration }} --no-restore -p:Platform=x64 -p:RunAnalyzers=true

      - name: Run tests
        run: dotnet test CrystalRenderer.sln --configuration ${{ matrix.configuration }} --no-build --no-restore -p:Platform=x64
